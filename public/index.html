<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSU레벨업캠퍼스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 배경 애니메이션 -->
    <div class="background-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 로고/제목 영역 -->
        <div class="logo-section">
            <div class="logo">🎓</div>
            <h1 class="app-title">WSU레벨업캠퍼스</h1>
            <p class="tagline">게임처럼 재미있게, 친구들과 함께 배우는 맞춤형 학습</p>
        </div>

        <!-- 레벨/경험치 미리보기 -->
        <div class="preview-stats">
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-text">레벨 시스템</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎮</div>
                <div class="stat-text">게임형 학습</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-text">친구와 함께</div>
            </div>
        </div>

        <!-- 시작 버튼 -->
        <button class="start-button" onclick="startApp()">
            <span>🚀 시작하기</span>
        </button>

        <!-- 추가 정보 -->
        <div class="info-text">
            <p>나만의 속도로 배우고, 레벨업하며 성장하세요!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
